services:
  # Backend PHP API
  - type: web
    name: daba-api
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENT_SECRET_KEY
        generateValue: true
      - key: EXTERNAL_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://daba.vercel.app
      - key: API_URL
        value: https://daba-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://daba.vercel.app,https://www.daba.tg,https://daba.tg
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
    healthCheckPath: /health.php
    autoDeploy: false

