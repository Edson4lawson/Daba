# =============================================================================
# daba - Kubernetes Secrets
# NOTE: En production, utilisez kubectl create secret ou external-secrets-operator
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: daba-secrets
  namespace: daba
type: Opaque
stringData:
  # Base de données
  db-host: "your-postgres-host"
  db-port: "5432"
  db-name: "bloom_chloe"
  db-user: "bloom_user"
  db-password: "CHANGE_THIS_SECURE_PASSWORD"
  
  # Sécurité
  jwt-secret: "CHANGE_THIS_LONG_RANDOM_SECRET_64_CHARS_MINIMUM"
  payment-secret-key: "CHANGE_THIS_PAYMENT_SECRET"
  
  # Stripe
  stripe-secret-key: "sk_live_YOUR_STRIPE_SECRET_KEY"
  stripe-webhook-secret: "whsec_YOUR_STRIPE_WEBHOOK_SECRET"
  
  # Email (SendGrid)
  smtp-host: "smtp.sendgrid.net"
  smtp-username: "apikey"
  smtp-password: "SG.YOUR_SENDGRID_API_KEY"
  
  # Cloudinary (images)
  cloudinary-cloud-name: "your-cloud-name"
  cloudinary-api-key: "YOUR_API_KEY"
  cloudinary-api-secret: "YOUR_API_SECRET"
